$kind: http-request
url: "{{baseUrl}}:/driver/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  id: "0000"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
settings:
  disabledSystemHeaders:
    - accept
order: 1000
