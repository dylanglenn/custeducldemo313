$kind: http-request
url: "{{baseUrl}}:/vehicle/:id"
method: GET
pathVariables:
  id: "1002"
scripts:
  - type: afterResponse
    code: |-
      const vinDecoder = pm.require('npm:vin-decode@0.2.0');

      let res = vinDecoder(pm.response.json().vehicle.vin).decode();

      console.log(res);
    language: text/javascript
    packages:
      npm:vin-decode@0.2.0:
        id: npm:vin-decode@0.2.0
order: 3000
