$kind: http-example
request:
  url: "{{baseUrl}}/display"
  method: GET
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "driver": "1001",
        "vehicle": "1002"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "message": "Success"
      }
order: 1000
