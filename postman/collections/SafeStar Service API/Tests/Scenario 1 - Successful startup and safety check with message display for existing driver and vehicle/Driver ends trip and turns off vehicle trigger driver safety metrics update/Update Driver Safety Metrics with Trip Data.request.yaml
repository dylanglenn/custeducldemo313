$kind: http-request
url: "{{baseUrl}}/driver/:id"
method: PUT
pathVariables:
  id: "1001"
body:
  type: json
  content: |-
    {
        "safetyScore": 95,
        "hardStops": 0,
        "speeding": 1,
        "nightDrives": 0,
        "weather": 0,
        "ignoredWarnings": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
