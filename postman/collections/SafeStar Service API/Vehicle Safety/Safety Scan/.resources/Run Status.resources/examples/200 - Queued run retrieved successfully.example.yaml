$kind: http-example
request:
  url: "{{baseUrl}}/run/:id"
  method: GET
  pathVariables:
    id: "2"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "run": "1",
          "status": "QUEUED",
          "message": "Running..."
      }
order: 2000
