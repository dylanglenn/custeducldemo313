$kind: http-example
request:
  url: "{{baseUrl}}/vehicle/:id"
  method: GET
  pathVariables:
    - key: id
      value: "0000"
      description: Vehicle UUID
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VEHICLE_NOT_FOUND",
          "message": "No record in Vehicle Service for this ID.",
          "details": {
            "vehicleId": "0000"
          }
        }
      }
order: 3000
