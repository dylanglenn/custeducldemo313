$kind: http-example
request:
  url: "{{baseUrl}}/driver/:id"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
  pathVariables:
    id: "1001"
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "Request body failed validation.",
          "details": {
            "fields": [
              {
                "field": "safetyScore",
                "issue": "must be an integer between 0 and 100"
              }
            ]
          }
        }
      }
order: 2000
