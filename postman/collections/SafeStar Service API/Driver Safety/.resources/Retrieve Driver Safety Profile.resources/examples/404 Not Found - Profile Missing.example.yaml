$kind: http-example
request:
  url: "{{baseUrl}}/driver/:id"
  method: GET
  pathVariables:
    - key: id
      value: "0000"
      description: Driver UUID
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "PROFILE_NOT_FOUND",
          "message": "No safety profile found for the specified driver.",
          "details": {
            "driverId": "0000"
          }
        }
      }
order: 2000
